name: mentor-portal
services:
  web:
    image: mentor-portal:${PORTAL_IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    env_file: ${PORTAL_ENV_FILE:-.env.production}
    environment:
      DATA_DIR: /data
      MIGRATIONS_DIR: /app/drizzle
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${PORTAL_HTTP_PORT:-3100}:3000"
    volumes:
      - portal-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  sync:
    image: mentor-portal:${PORTAL_IMAGE_TAG:-local}
    command: [node, standalone-dist/sync-worker.mjs]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file: ${PORTAL_ENV_FILE:-.env.production}
    environment:
      DATA_DIR: /data
      MIGRATIONS_DIR: /app/drizzle
    volumes:
      - portal-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      web: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  portal-data:
