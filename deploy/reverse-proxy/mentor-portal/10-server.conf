server {
    listen 80;
    listen [::]:80;
    server_name mentor-portal.com;

    include /data/nginx/custom/mentor-portal/cloudflare-real-ip.inc;
    access_log /data/logs/mentor-portal_access.log mentor_portal_path;
    # Nginx error messages cannot be formatted to omit a request query. The
    # path-only access log retains response/upstream status and request timing.
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    if ($host != mentor-portal.com) { return 444; }
    return 308 https://mentor-portal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mentor-portal.com;

    ssl_certificate /data/custom_ssl/npm-29/fullchain.pem;
    ssl_certificate_key /data/custom_ssl/npm-29/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:mentor_portal_tls:5m;
    ssl_session_timeout 1d;

    include /data/nginx/custom/mentor-portal/cloudflare-real-ip.inc;
    access_log /data/logs/mentor-portal_access.log mentor_portal_path;
    error_log /dev/null crit;
    client_max_body_size 16m;
    client_body_timeout 30s;
    if ($host != mentor-portal.com) { return 444; }

    location = /api/auth/usso/callback {
        # Even an upstream failure must not log the authorization code/state.
        error_log /dev/null crit;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        include /data/nginx/custom/mentor-portal/proxy.inc;
    }

    location / {
        include /data/nginx/custom/mentor-portal/proxy.inc;
    }
}
