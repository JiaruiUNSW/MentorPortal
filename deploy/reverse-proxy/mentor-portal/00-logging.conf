# Deliberately omit $request, $request_uri, $args, Referer and User-Agent.
# The same format covers normal, failed and callback requests.
log_format mentor_portal_path escape=json
    '{"time":"$time_iso8601","client":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_duration":"$upstream_response_time"}';
